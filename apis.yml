aid: clubzero
name: CLUBZERO
description: CLUBZERO (CLUBZERØ) is a London-based reuse system administrator helping
  the food and beverage industry transition from single-use to reusable packaging.
  Its AI-powered platform serializes every reusable item with a GS1-standard QR, RFID,
  or barcode identifier, then coordinates the drop points, collection, washing, and
  redistribution logistics that keep packaging in circulation across on-trade, online
  delivery, and retail channels. CLUBZERO reports 95-98% return rates and 3.3M+ packaging
  rotations, running reuse programs for brands including McDonald's, Nestlé, Aramark,
  Compass Group, Just Eat, and the Wimbledon Championships. Backed by Seedcamp and
  added to the API Evangelist network as a company profile; no public API surface is
  currently documented.
